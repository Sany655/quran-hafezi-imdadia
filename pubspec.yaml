name: quran_hafezi_imdadia
description: "আল-কুরআন (Al-Quran): 15-Line Hafezi Quran with Bengali Translation, Word-by-Word, and Tafsir"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  google_fonts: ^6.2.1
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - data/quran_imdadia.db
    - assets/audio/flipsound.mp3
    - assets/audio/flipsound.ogg
    - assets/pages/
