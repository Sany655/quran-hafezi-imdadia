name: Build, Release APK & Deploy Landing Page

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'release-and-pages'
  cancel-in-progress: false

jobs:
  test_and_analyze:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer
        run: flutter analyze --no-fatal-infos

      - name: Run Unit Tests
        run: flutter test

  build_and_release_apk:
    name: Build Android APK & Publish Release
    needs: test_and_analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare APK Asset
        id: prep
        run: |
          APK_NAME="Quran-Hafezi-Imdadia.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "./${APK_NAME}"
          echo "apk_path=./${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Publish Rolling 'latest' GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "আল-কুরআন হাফেজী (সর্বশেষ রিলিজ)"
          body: |
            ## আল-কুরআন হাফেজী (১৫ লাইন) - Latest Build
            
            স্বয়ংক্রিয়ভাবে সংকলিত সর্বশেষ অ্যান্ড্রয়েড রিলিজ (Build #${{ github.run_number }}).
            
            ### ✨ অন্তর্ভুক্ত বৈশিষ্ট্যসমূহ:
            - **১৫ লাইনের ঐতিহ্যবাহী ইমদাদিয়া হাফেজী কোরআন (Imdadia 15-Line Mushaf)**
            - **দ্বৈত বাংলা অনুবাদ**: তাইসীরুল কুরআন ও মাওলানা মুজিবুর রহমান
            - **শব্দে শব্দে অর্থ (Word-by-Word Bengali)** ও বিস্তারিত তাফসীর
            - **১০০% দ্রুতগতির অফলাইন SQLite ডাটাবেজ** (ইন্টারনেট ছাড়াও অনুসন্ধানযোগ্য)
            - **বাস্তবধর্মী পাতার শব্দ (Page Flip Sound)**
            - **সম্পূর্ণ বিজ্ঞাপনহীন ও উন্মুক্ত কোড (Sadaqah Jariyah)**
            
            ---
            ### 📥 সরাসরি ডাউনলোড লিংক:
            - [Quran-Hafezi-Imdadia.apk](https://github.com/Sany655/quran-hafezi-imdadia/releases/latest/download/Quran-Hafezi-Imdadia.apk)
          files: ${{ steps.prep.outputs.apk_path }}
          draft: false
          prerelease: false

  deploy_landing_page:
    name: Deploy Landing Page to GitHub Pages
    needs: build_and_release_apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Synchronize landing to docs
        run: |
          mkdir -p docs
          cp -r landing/* docs/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
