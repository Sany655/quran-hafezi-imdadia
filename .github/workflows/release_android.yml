name: Build & Release Android APK (Manual or Tagged Only)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.1 or latest)'
        required: true
        default: 'latest'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test_and_analyze:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer
        run: flutter analyze --no-fatal-infos

      - name: Run Unit Tests
        run: flutter test

  build_and_release_apk:
    name: Build Android APK & Publish Release
    needs: test_and_analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Android Release Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "❌ Missing Android signing secrets! Please configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in Repository Secrets."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/upload-keystore.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Cleanup Signing Files
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks

      - name: Prepare APK Asset
        id: prep
        run: |
          APK_NAME="Quran-Hafezi-Imdadia.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "./${APK_NAME}"
          echo "apk_path=./${APK_NAME}" >> $GITHUB_OUTPUT
          
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "release_tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.release_tag }}
          name: "আল-কুরআন হাফেজী (${{ steps.prep.outputs.release_tag }})"
          body: |
            ## আল-কুরআন হাফেজী (১৫ লাইন) - ${{ steps.prep.outputs.release_tag }}
            
            স্বয়ংক্রিয়ভাবে সংকলিত অ্যান্ড্রয়েড রিলিজ।
            
            ### ✨ অন্তর্ভুক্ত বৈশিষ্ট্যসমূহ:
            - **১৫ লাইনের ঐতিহ্যবাহী ইমদাদিয়া হাফেজী কোরআন (Imdadia 15-Line Mushaf)**
            - **প্রামাণ্য ৩টি বাংলা অনুবাদ**: তাওযীহুল কুরআন (মুফতী তাকী উসমানী), মা'আরিফুল কুরআন (মুফতী শফী রহ.) ও তাইসীরুল কুরআন
            - **প্রামাণ্য তাফসীর গ্রন্থ**: তাওযীহুল কুরআন, আহসানুল বায়ান, তাফসীর ইবনে কাসীর এবং মা'আরিফুল কুরআন (৮ খণ্ড) রেফারেন্স ম্যাপিং
            - **স্মুথ ২-পৃষ্ঠা স্লাইডিং ক্যাশিং**: পরবর্তী ও পূর্ববর্তী ২ পৃষ্ঠা আগে থেকেই প্রি-লোড হয়ে থাকায় দ্রুত পাতা উল্টানোতে কোনো ল্যাগ থাকে না
            - **উন্নত বাংলা ও আরবি অনুসন্ধান**: ৩টি অনুবাদেই মাল্টি-ওয়ার্ড ও `সূরা:আয়াত` সার্চ, শব্দ হাইলাইটিং, সঠিক পৃষ্ঠা জাম্প এবং ১ বা সবগুলো অনুবাদ একসাথে শেয়ার সুবিধা
            - **শব্দে শব্দে বাংলা অর্থ (Word-by-Word Bengali)**
            - **হরাইজন্টাল ওভারফ্লো ফিক্স**: অনুবাদ ও তাফসীর প্যানেলের ট্যাব বক্স বার এখন যেকোনো স্ক্রিনে নিখুঁত ও মসৃণভাবে স্ক্রোলযোগ্য
            - **অপটিমাইজড ১০০% অফলাইন SQLite ডাটাবেজ (১০৫ MB)**: সাইজ সাশ্রয়ী এবং বিদ্যুতগতির সম্পূর্ণ অফলাইন অ্যাক্সেস
            - **সম্পূর্ণ বিজ্ঞাপনহীন ও উন্মুক্ত কোড (Sadaqah Jariyah)**
            
            ---
            ### 📥 সরাসরি ডাউনলোড লিংক:
            - [Quran-Hafezi-Imdadia.apk](https://github.com/Sany655/quran-hafezi-imdadia/releases/download/${{ steps.prep.outputs.release_tag }}/Quran-Hafezi-Imdadia.apk)
          files: ${{ steps.prep.outputs.apk_path }}
          draft: false
          prerelease: false
