name: Deploy Web App to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'github-pages'
  cancel-in-progress: true

jobs:
  deploy_web:
    name: Build & Deploy Web App
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Fresh Web Metadata
        run: python scripts/generate_web_data.py

      - name: Prepare Web Distribution Bundle
        run: |
          mkdir -p docs/pages
          # Copy all landing pages and web assets
          cp -r landing/* docs/
          # Copy authentic 612 Imdadia pages to docs/pages
          cp -r assets/pages/* docs/pages/
          echo "Web bundle prepared with $(ls -1 docs/pages | wc -l) pages"

      - name: Validate Web Bundle
        shell: bash
        run: |
          test -f data/quran_imdadia.db
          DB_SIZE=$(stat -c%s data/quran_imdadia.db)
          if [ "$DB_SIZE" -lt 1000000 ]; then
            echo "::error::SQLite database is missing or is only a Git LFS pointer"
            exit 1
          fi
          PAGE_COUNT=$(find docs/pages -maxdepth 1 -type f | wc -l)
          if [ "$PAGE_COUNT" -lt 612 ]; then
            echo "::error::Expected at least 612 Mushaf page assets, found $PAGE_COUNT"
            exit 1
          fi
          python -c "import glob,json,os; required=['docs/index.html','docs/reader.html','docs/manifest.json','docs/sw.js']; missing=[p for p in required if not os.path.isfile(p)]; assert not missing, 'Missing: '+str(missing); files=glob.glob('docs/**/*.json',recursive=True); [json.load(open(p,encoding='utf-8')) for p in files]; print(f'Validated {len(required)} required files and {len(files)} JSON files')"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
