name: Android Test Build (No Publish)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant (release recommended for real performance)'
        required: true
        type: choice
        options:
          - release
          - debug
        default: release
      split_per_abi:
        description: 'Split APKs per ABI (produces separate smaller APKs for arm64-v8a, armeabi-v7a, x86_64)'
        required: false
        type: boolean
        default: false
      run_tests:
        description: 'Run code analysis and unit tests before building'
        required: false
        type: boolean
        default: true
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - 'landing/**'
      - 'docs/**'
      - 'drafts/**'
      - 'reference_books/**'
      - 'scripts/**'
      - '**.md'
      - '.gitattributes'
  push:
    branches:
      - main
    paths-ignore:
      - 'landing/**'
      - 'docs/**'
      - 'drafts/**'
      - 'reference_books/**'
      - 'scripts/**'
      - '**.md'
      - '.gitattributes'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_build:
    name: Test & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Verify Git LFS Assets
        run: |
          echo "=== Verifying SQLite Database and LFS Assets ==="
          if [ ! -f "data/quran_imdadia.db" ]; then
            echo "::error::data/quran_imdadia.db not found!"
            exit 1
          fi
          DB_SIZE=$(stat -c%s "data/quran_imdadia.db" 2>/dev/null || stat -f%z "data/quran_imdadia.db" 2>/dev/null || echo 0)
          echo "Database file size: ${DB_SIZE} bytes"
          if [ "$DB_SIZE" -lt 1000000 ]; then
            echo "::error::data/quran_imdadia.db is smaller than 1MB (${DB_SIZE} bytes). Git LFS checkout did not pull the full file."
            exit 1
          fi
          echo "Git LFS assets verified successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_tests != 'false' }}
        run: flutter analyze --no-fatal-infos

      - name: Run Unit Tests
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_tests != 'false' }}
        run: flutter test

      - name: Extract Project Metadata
        id: meta
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '\r\n ')
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          BUILD_MODE="${{ github.event.inputs.build_type || 'release' }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT
          echo "build_mode=${BUILD_MODE}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION} | Short SHA: ${SHORT_SHA} | Mode: ${BUILD_MODE}"

      - name: Build Android Test APK
        run: |
          BUILD_MODE="${{ steps.meta.outputs.build_mode }}"
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.split_per_abi }}" = "true" ]; then
            EXTRA_FLAGS="--split-per-abi"
          fi
          echo "Executing: flutter build apk --${BUILD_MODE} ${EXTRA_FLAGS} --android-skip-build-dependency-validation"
          flutter build apk --${BUILD_MODE} ${EXTRA_FLAGS} --android-skip-build-dependency-validation

      - name: Package Test Artifacts
        id: prep
        run: |
          mkdir -p dist/apk
          BUILD_MODE="${{ steps.meta.outputs.build_mode }}"
          VERSION="${{ steps.meta.outputs.version }}"
          SHORT_SHA="${{ steps.meta.outputs.short_sha }}"
          SRC_DIR="build/app/outputs/flutter-apk"

          if [ -f "${SRC_DIR}/app-${BUILD_MODE}.apk" ]; then
            TARGET_NAME="Quran-Hafezi-Imdadia-v${VERSION}-test-${BUILD_MODE}-${SHORT_SHA}.apk"
            cp "${SRC_DIR}/app-${BUILD_MODE}.apk" "dist/apk/${TARGET_NAME}"
            echo "Staged: ${TARGET_NAME}"
          else
            for apk in "${SRC_DIR}"/app-*-${BUILD_MODE}.apk; do
              if [ -f "$apk" ]; then
                BASE=$(basename "$apk")
                TARGET_NAME="Quran-Hafezi-Imdadia-v${VERSION}-test-${BASE}"
                cp "$apk" "dist/apk/${TARGET_NAME}"
                echo "Staged split APK: ${TARGET_NAME}"
              fi
            done
          fi

          cd dist/apk
          sha256sum *.apk > SHA256SUMS.txt
          cd -

          echo "=== Ready Test Artifacts ==="
          ls -lh dist/apk/

      - name: Upload Test APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-hafezi-test-apk-${{ steps.meta.outputs.short_sha }}-run${{ github.run_number }}
          path: dist/apk/*
          retention-days: 14
          if-no-files-found: error

      - name: Generate Action Summary
        if: always()
        run: |
          echo "### 📱 Android Test Build Summary (Internal Preview)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **App Name** | আল-কুরআন হাফেজী (Quran Hafezi Imdadia) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Job Status** | ${{ job.status == 'success' && '✅ Succeeded' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ steps.meta.outputs.version || 'unknown' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Mode** | \`${{ steps.meta.outputs.build_mode || 'release' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch / Ref** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ steps.meta.outputs.short_sha || github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Timestamp** | ${{ steps.meta.outputs.build_time }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Publish Status** | 🚫 **Not Published** (Artifact only, test preview) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "dist/apk" ] && [ "$(ls -A dist/apk 2>/dev/null)" ]; then
            echo "#### 📦 Generated APK Files & Checksums" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cd dist/apk
            cat SHA256SUMS.txt 2>/dev/null || ls -lh *.apk
            cd -
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### 📲 How to Install & Test on Android:" >> $GITHUB_STEP_SUMMARY
            echo "1. Scroll down to the **Artifacts** section at the bottom of this run summary." >> $GITHUB_STEP_SUMMARY
            echo "2. Download the \`quran-hafezi-test-apk-*\` ZIP file." >> $GITHUB_STEP_SUMMARY
            echo "3. Extract the ZIP and transfer the \`.apk\` to your Android phone." >> $GITHUB_STEP_SUMMARY
            echo "4. Tap the APK to install (enable *Install unknown apps* if prompted)." >> $GITHUB_STEP_SUMMARY
          fi
